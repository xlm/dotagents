name: Release
run-name: ${{ github.event.workflow_run.display_title }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  tag:
    name: Tag the release and prepare its notes
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          !startsWith(github.event.workflow_run.head_commit.message, 'release:') }}
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the default branch with release tags
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install git-cliff for versioning and release notes
        run: python3 -m pip install git-cliff==2.14.2
      - name: Choose the release version and generate notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release.py
      - name: Upload release notes for publishing
        uses: actions/upload-artifact@v7
        if: steps.release.outputs.version != ''
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          overwrite: true

  # No artifacts: delete this job, remove build from publish.needs, and delete
  # the artifact download step below. Supply build.yml for artifact releases.
  build:
    name: Build release artifacts
    needs: tag
    if: needs.tag.outputs.version != ''
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.tag.outputs.version }}

  publish:
    name: Publish the release
    needs: [tag, build]
    if: needs.tag.outputs.version != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: <project>-*
          path: dist
          merge-multiple: true
      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Publish the release with versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          # A failed asset upload can leave a draft. Keep its tag for this retry.
          if draft=$(gh release view "$VERSION" --json isDraft --jq .isDraft 2>release-view.err); then
            if [ "$draft" = true ]; then
              gh release delete "$VERSION" --yes
            fi
          elif ! grep -Eq 'release not found|HTTP 404' release-view.err; then
            # A missing release is expected, but other lookup errors must stop us.
            cat release-view.err >&2
            exit 1
          fi

          # Replace <project> with the artifact prefix used by build.yml.
          shopt -s nullglob
          assets=()
          for file in dist/'<project>'-*; do
            asset="dist/<project>-$VERSION-${file#dist/<project>-}"
            mv "$file" "$asset"
            assets+=("$asset")
          done
          # Delete this check with the build job when the repo has no artifacts.
          if [ ${#assets[@]} -eq 0 ]; then
            echo 'No dist/<project>-* files to attach.' >&2
            exit 1
          fi
          gh release create "$VERSION" "${assets[@]}" --verify-tag --notes-file release-notes.md
          printf 'Released %s\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
