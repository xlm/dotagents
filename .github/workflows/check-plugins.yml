name: Check plugins

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-plugins:
    name: Validate plugins and run smoke tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js for plugin CLIs
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plugin CLIs for smoke tests
        run: npm install -g @openai/codex@0.171.0 @anthropic-ai/claude-code@2.1.330 @github/copilot@1.0.114
      - name: Install PyYAML for plugin validation
        run: python3 -m pip install PyYAML==6.0.3
      - name: Run Python unit tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Check plugin metadata, installs, skills and hooks
        run: scripts/check-plugins.py
