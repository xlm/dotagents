name: Release
run-name: ${{ github.event.workflow_run.display_title }}

on:
  workflow_run:
    workflows: [Check plugins]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  checks: read

jobs:
  release:
    name: Publish the plugin release
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          !startsWith(github.event.workflow_run.head_commit.message, 'release:') }}
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the default branch with release tags
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install git-cliff for release notes
        run: python3 -m pip install git-cliff==2.14.2 PyYAML==6.0.3
      - name: Prepare the release from the latest checked commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release.py
